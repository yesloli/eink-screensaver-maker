<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨水屏阅读器屏保制作工具</title>
<style>
  :root{
    --paper:#f5f3ee; --card:#fff; --ink:#1b1b19; --ink2:#4a4a44; --ink3:#8b867a;
    --line:#e3ded2; --line2:#d3cdbe; --accent:#b4402a; --accent-bg:#f7e8e3;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:24px;line-height:1.6}
  .app{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
  h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--ink3)}
  main{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-top:18px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}

  .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .cvwrap{position:relative;background:#eceae4;border-radius:10px;overflow:hidden;line-height:0;cursor:grab}
  .cvwrap.dragging{cursor:grabbing}
  canvas{width:100%;height:auto;display:block;touch-action:none}
  .frame{position:absolute;inset:0;pointer-events:none;border:1.5px solid rgba(180,64,42,.85);border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}
  .frame::before,.frame::after{content:"";position:absolute;background:rgba(180,64,42,.22)}
  .frame::before{left:0;right:0;top:50%;height:1px}
  .frame::after{top:0;bottom:0;left:50%;width:1px}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--ink3);font-size:13px}
  .empty b{font-size:15px;color:var(--ink2)}
  .drop{border:1.5px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--ink3);margin-top:12px}
  .drop.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:9px;gap:10px;flex-wrap:wrap}
  .meta b{color:var(--ink2);font-weight:700}

  .panel{display:flex;flex-direction:column;gap:12px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .box h2{font-size:12px;letter-spacing:.1em;color:var(--ink3);font-weight:700;margin-bottom:10px}
  button{font-family:inherit;font-size:13px;border:1px solid var(--line2);background:#fbfaf7;color:var(--ink);
    border-radius:9px;padding:8px 12px;cursor:pointer;transition:.12s}
  button:hover{background:#f2efe8;border-color:#c3bcac}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button.primary:hover{background:#9d3623}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0}
  .field + .field{border-top:1px solid var(--line)}
  select{font-family:inherit;font-size:13px;padding:5px 8px;border-radius:7px;border:1px solid var(--line2);background:#fbfaf7;color:var(--ink)}
  input[type=range]{width:120px;accent-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .list{max-height:210px;overflow:auto;font-size:12.5px;margin:-4px -4px 0}
  .item{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;cursor:pointer;color:var(--ink2)}
  .item:hover{background:#f6f3ec}
  .item.on{background:var(--accent-bg);color:var(--accent);font-weight:700}
  .item .dot{width:5px;height:5px;border-radius:50%;background:#cfc9bb;flex:none}
  .item.done .dot{background:#2b7355}
  .item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tip{font-size:11.5px;color:var(--ink3);line-height:1.65}
  kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:#f1eee7;border:1px solid var(--line2);
    border-bottom-width:2px;border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>墨水屏阅读器屏保制作</h1>
    <div class="sub">每张图单独调整位置 · 框内就是成品 · 不压缩上传，全程本地处理</div>
  </header>

  <main>
    <section class="stage">
      <div class="cvwrap" id="wrap">
        <canvas id="cv" width="960" height="720"></canvas>
        <div class="frame"></div>
        <div class="empty" id="empty"><b>把图片拖进来</b><span>或点右侧「打开图片」，支持多选</span></div>
      </div>
      <div class="meta">
        <span id="info">未载入图片</span>
        <span id="pos">—</span>
      </div>
      <div class="drop" id="drop">拖拽图片到此处也可以</div>
    </section>

    <aside class="panel">
      <div class="box">
        <h2>图片</h2>
        <div class="row" style="margin-bottom:10px">
          <button class="primary" id="open">打开图片</button>
          <button id="prev">上一张</button>
          <button id="next">下一张</button>
        </div>
        <div class="list" id="list"><div class="tip" style="padding:4px 7px">还没有图片</div></div>
        <input type="file" id="file" accept="image/*" multiple hidden>
      </div>

      <div class="box">
        <h2>裁切</h2>
        <div class="field">
          <label>缩放</label>
          <div style="display:flex;align-items:center;gap:8px">
            <input type="range" id="zoom" min="100" max="500" value="100">
            <b id="zoomv" style="font-size:12px;width:42px;text-align:right;color:var(--ink2)">100%</b>
          </div>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="fit">铺满</button>
          <button id="reset">重置</button>
        </div>
      </div>

      <div class="box">
        <h2>输出</h2>
        <div class="field">
          <label>尺寸</label>
          <select id="size">
            <option value="1920x1440">1920×1440（Ocean 3 Plus 8 寸）</option>
            <option value="1680x1264">1680×1264（Ocean 6 / 7 寸）</option>
            <option value="1440x1920">1440×1920（竖屏）</option>
          </select>
        </div>
        <div class="field">
          <label class="chk"><input type="checkbox" id="gray" checked> 转灰度</label>
          <label class="chk"><input type="checkbox" id="tone" checked> 轻微提对比</label>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="save">保存这张</button>
          <button id="saveAll">保存全部</button>
        </div>
      </div>

      <div class="box">
        <div class="tip">
          拖拽移动画面 · 滚轮缩放 · <kbd>↑↓←→</kbd> 微调 1px（按住 <kbd>Shift</kbd> 为 10px）<br>
          <kbd>A</kbd> / <kbd>D</kbd> 切换上一张下一张。<br>
          每张图的缩放和位置会单独记住，切回来不会丢。
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
  let CW = 960, CH = 720;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const emptyEl = document.getElementById('empty');
  const listEl = document.getElementById('list');
  const infoEl = document.getElementById('info');
  const posEl = document.getElementById('pos');
  const zoomEl = document.getElementById('zoom');
  const zoomv = document.getElementById('zoomv');
  const sizeEl = document.getElementById('size');
  const grayEl = document.getElementById('gray');
  const toneEl = document.getElementById('tone');

  let items = [];   // {name, img, zoom, tx, ty, done}
  let cur = -1;

  function setView(w, h){
    CW = 960;
    CH = Math.round(CW * h / w);
    cv.width = CW;
    cv.height = CH;
  }
  setView(1920, 1440);

  function coverScale(it){
    return Math.max(CW / it.img.naturalWidth, CH / it.img.naturalHeight);
  }
  function scaleOf(it){ return coverScale(it) * it.zoom; }

  function clampPos(it){
    const s = scaleOf(it);
    const w = it.img.naturalWidth * s, h = it.img.naturalHeight * s;
    it.tx = Math.min(0, Math.max(CW - w, it.tx));
    it.ty = Math.min(0, Math.max(CH - h, it.ty));
  }

  function center(it){
    const s = scaleOf(it);
    it.tx = (CW - it.img.naturalWidth * s) / 2;
    it.ty = (CH - it.img.naturalHeight * s) / 2;
    clampPos(it);
  }

  function draw(){
    ctx.fillStyle = '#eceae4';
    ctx.fillRect(0, 0, CW, CH);
    const it = items[cur];
    if (!it) return;
    const s = scaleOf(it);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(it.img, it.tx, it.ty, it.img.naturalWidth * s, it.img.naturalHeight * s);
  }

  function refreshUI(){
    const it = items[cur];
    if (!it){
      emptyEl.style.display = 'flex';
      infoEl.textContent = '未载入图片';
      posEl.textContent = '—';
      zoomEl.disabled = true;
      return;
    }
    emptyEl.style.display = 'none';
    infoEl.innerHTML = '<b>' + it.img.naturalWidth + '×' + it.img.naturalHeight + '</b> 原图 · ' +
      it.name.replace(/[<>&]/g, '');
    posEl.textContent = (cur + 1) + ' / ' + items.length;
    zoomEl.disabled = false;
    zoomEl.value = Math.round(it.zoom * 100);
    zoomv.textContent = Math.round(it.zoom * 100) + '%';
    Array.from(listEl.children).forEach((el, i) => el.classList.toggle('on', i === cur));
  }

  function render(){
    draw();
    refreshUI();
  }

  function addFiles(files){
    const list = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (!list.length) return;
    let pending = list.length;
    list.forEach(f => {
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        const it = { name: f.name, img, zoom: 1, tx: 0, ty: 0, done: false };
        center(it);
        items.push(it);
        buildList();
        if (cur < 0){ cur = 0; render(); }
        else { refreshUI(); }
        URL.revokeObjectURL(url);
        if (--pending === 0) buildList();
      };
      img.onerror = () => { URL.revokeObjectURL(url); if (--pending === 0) buildList(); };
      img.src = url;
    });
  }

  function buildList(){
    if (!items.length){
      listEl.innerHTML = '<div class="tip" style="padding:4px 7px">还没有图片</div>';
      return;
    }
    listEl.innerHTML = '';
    items.forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'item' + (i === cur ? ' on' : '') + (it.done ? ' done' : '');
      d.innerHTML = '<i class="dot"></i><span>' + it.name.replace(/[<>&]/g, '') + '</span>';
      d.onclick = () => { cur = i; render(); };
      listEl.appendChild(d);
    });
  }

  // 拖拽
  let dragging = false, lx = 0, ly = 0;
  function toCanvas(e){
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (CW / r.width), y: (e.clientY - r.top) * (CH / r.height) };
  }
  wrap.addEventListener('pointerdown', e => {
    if (cur < 0) return;
    dragging = true; wrap.classList.add('dragging');
    const p = toCanvas(e); lx = p.x; ly = p.y;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging || cur < 0) return;
    const p = toCanvas(e);
    const it = items[cur];
    it.tx += p.x - lx; it.ty += p.y - ly;
    lx = p.x; ly = p.y;
    clampPos(it); draw();
  });
  wrap.addEventListener('pointerup', e => {
    dragging = false; wrap.classList.remove('dragging');
  });
  wrap.addEventListener('pointercancel', () => { dragging = false; wrap.classList.remove('dragging'); });

  // 滚轮缩放（以指针为中心）
  wrap.addEventListener('wheel', e => {
    if (cur < 0) return;
    e.preventDefault();
    const it = items[cur];
    const p = toCanvas(e);
    const old = it.zoom;
    const next = Math.min(5, Math.max(1, old * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    if (next === old) return;
    const k = next / old;
    it.tx = p.x - (p.x - it.tx) * k;
    it.ty = p.y - (p.y - it.ty) * k;
    it.zoom = next;
    clampPos(it);
    zoomEl.value = Math.round(next * 100);
    zoomv.textContent = Math.round(next * 100) + '%';
    draw();
  }, { passive: false });

  zoomEl.addEventListener('input', () => {
    if (cur < 0) return;
    const it = items[cur];
    const next = Math.max(1, Math.min(5, zoomEl.value / 100));
    const k = next / it.zoom;
    it.tx = CW / 2 - (CW / 2 - it.tx) * k;
    it.ty = CH / 2 - (CH / 2 - it.ty) * k;
    it.zoom = next;
    clampPos(it);
    zoomv.textContent = Math.round(next * 100) + '%';
    draw();
  });

  sizeEl.addEventListener('change', () => {
    const [W, H] = sizeEl.value.split('x').map(Number);
    setView(W, H);
    items.forEach(it => { it.zoom = 1; center(it); });
    render();
  });

  document.getElementById('fit').onclick = () => {
    if (cur < 0) return;
    items[cur].zoom = 1; center(items[cur]); render();
  };
  document.getElementById('reset').onclick = () => {
    if (cur < 0) return;
    items[cur].zoom = 1; items[cur].done = false; center(items[cur]); render(); buildList();
  };
  document.getElementById('open').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  document.getElementById('prev').onclick = () => { if (items.length){ cur = (cur - 1 + items.length) % items.length; render(); } };
  document.getElementById('next').onclick = () => { if (items.length){ cur = (cur + 1) % items.length; render(); } };

  // 拖放
  const drop = document.getElementById('drop');
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('on');
  }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('on');
  }));
  drop.addEventListener('drop', e => { if (e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // 键盘
  window.addEventListener('keydown', e => {
    if (cur < 0) return;
    const it = items[cur];
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft'){ it.tx += step; clampPos(it); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowRight'){ it.tx -= step; clampPos(it); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ it.ty += step; clampPos(it); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowDown'){ it.ty -= step; clampPos(it); draw(); e.preventDefault(); }
    else if (e.key === 'a' || e.key === 'A'){ document.getElementById('prev').click(); }
    else if (e.key === 'd' || e.key === 'D'){ document.getElementById('next').click(); }
  });

  function exportOne(it){
    const [W, H] = sizeEl.value.split('x').map(Number);
    const ratio = W / CW;
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    const c = out.getContext('2d');
    const s = scaleOf(it);
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
    c.drawImage(it.img, it.tx * ratio, it.ty * ratio,
      it.img.naturalWidth * s * ratio, it.img.naturalHeight * s * ratio);
    if (grayEl.checked || toneEl.checked){
      const imgData = c.getImageData(0, 0, W, H);
      const d = imgData.data;
      const k = toneEl.checked ? 1.06 : 1;
      const b = toneEl.checked ? 2 : 0;
      for (let i = 0; i < d.length; i += 4){
        let v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        v = (v - 128) * k + 128 + b;
        v = v < 0 ? 0 : v > 255 ? 255 : v;
        d[i] = d[i+1] = d[i+2] = v;
      }
      c.putImageData(imgData, 0, 0);
    }
    return new Promise(res => {
      out.toBlob(blob => {
        const a = document.createElement('a');
        const base = it.name.replace(/\.[^.]+$/, '');
        a.href = URL.createObjectURL(blob);
        a.download = base + '_' + W + 'x' + H + '.png';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        it.done = true;
        res();
      }, 'image/png');
    });
  }

  document.getElementById('save').onclick = async () => {
    if (cur < 0) return;
    await exportOne(items[cur]);
    buildList();
    document.getElementById('next').click();
  };
  document.getElementById('saveAll').onclick = async () => {
    for (const it of items){ await exportOne(it); await new Promise(r => setTimeout(r, 350)); }
    buildList();
  };

  render();
})();
</script>
</body>
</html>
